name: local
variables:
  - name: urlGrpcProxy
    value: http://localhost:18081
  - name: apiUrl
    value: http://localhost:18082
    description: "Backend API, published by deployments/compose.yml on 127.0.0.1 (API_PORT). Through nginx: http://localhost:18080"
  - name: login
    value: admin
    description: E-mail or username for auth/post token and post login; admin is ADMIN_USERNAME in deployments/.env
  - secret: true
    name: password
    description: Password of login; set it in Bruno, never in this file
  - secret: true
    name: newPassword
    description: New password for auth/post password
  - secret: true
    name: accessToken
    description: Set by auth/post token; sent as Bearer by the api folder
  - secret: true
    name: csrfToken
    description: Set by auth/post login; sent by auth/post refresh
  - name: userId
    value: ""
    description: Set by admin/users/post user; used by get, patch and reset password
