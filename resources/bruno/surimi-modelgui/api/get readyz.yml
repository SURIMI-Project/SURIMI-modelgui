http:
  method: GET
  url: "{{apiUrl}}/readyz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # get readyz

  Readiness of the API: what it needs to serve requests.

  ## Response

  | Field | Meaning |
  | --- | --- |
  | `status` | `ready` (200) or `not_ready` (503) |
  | `version` | Backend version |
  | `protocol` | Pinned controller protocol, `buf.build/surimi/surimi-protocol:<commit>` |
  | `checks.database` | Required: `SELECT 1` within 2 s |
  | `checks.controller` | Reported only: `GetProtocolVersion` within 2 s; a controller outage does not make the API not ready |
