docs: |-
  # get scenario contract

  The simulation contract of one scenario (`GetSimulationContract`), cached
  for 10 minutes.

  ## Response

  | Field | Meaning |
  | --- | --- |
  | `scenario_name` | As in the path |
  | `simulation` | `surimi.v1.Simulation` as protobuf JSON with the `.proto` field names: `case_study_name`, `start_date_time`, `maximum_end_date_time`, `time_step`, `geography`, `standards`, `items` |

  ## Notes

  Unknown scenario: `404` `not_found`. Change the last path segment to try
  another scenario.
