info:
  name: get initial hcr history
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/api/v1/scenarios/northwestern_med/initial-hcr-data/history"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # get initial hcr history

  Every distinct answer of `GetInitialHCRData` seen for the scenario, newest
  first: `id`, `content_hash`, `entry_count`, `first_seen_at`. A new row
  appears only when the controller's values change. No controller call.
