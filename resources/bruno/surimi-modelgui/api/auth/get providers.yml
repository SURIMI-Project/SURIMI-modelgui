http:
  method: GET
  url: "{{apiUrl}}/api/v1/auth/providers"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # get providers

  SSO providers configured with `OIDC_PROVIDERS`, for the sign-in buttons. No
  sign-in needed. An empty list means only local sign-in is on.

  ## Response

  `[{"key": "keycloak", "display_name": "Keycloak", "login_url": "/api/v1/auth/sso/keycloak/login"}]`
