info:
  name: post password
  type: http
  seq: 6

http:
  method: POST
  url: "{{apiUrl}}/api/v1/auth/password"
  body:
    type: json
    data: |-
      {
        "current_password": "{{password}}",
        "new_password": "{{newPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # post password

  Changes your own password. Side effect: every other session of the user
  ends; the one that made the call stays.

  ## Before you run it

  Set the secrets `password` (current) and `newPassword` (at least 12
  characters, not a common password, not containing the username or the
  name part of the e-mail). Afterwards copy `newPassword`
  into `password`, or `post token` stops working.

  ## Notes

  `204` on success; it also clears `must_change_password`. Wrong current
  password: `401`. Weak new password: `422` `weak_password`. SSO-only user:
  `409`.
