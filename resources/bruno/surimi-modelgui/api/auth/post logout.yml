info:
  name: post logout
  type: http
  seq: 7

http:
  method: POST
  url: "{{apiUrl}}/api/v1/auth/logout"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # post logout

  Ends the session of the current token: the token stops working at once
  (`401` on the next request), because every request checks the session in
  the database. Clears the cookies when signed in with `post login`. `204`.

  Run `post token` again to get a new token.
