info:
  name: get experiment options
  type: http
  seq: 9

http:
  method: GET
  url: "{{apiUrl}}/api/v1/scenarios/:scenario_name/experiment-options"
  params:
    - name: scenario_name
      value: northwestern_med
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # get experiment options

  Everything the experiment form needs for one scenario, in one call. Run it
  before `post experiment`.

  ## Response

  | Field | Meaning |
  | --- | --- |
  | `start_date_time`, `maximum_end_date_time` | The end date must be after the first and not after the second (contract) |
  | `climate_scenarios`, `climate_scenario_required` | Send one of them as `climate_scenario` when required; none for `aegean_sea` |
  | `pods_single_run`, `pods_mse_run` | Ecopath pods a run takes: 1, or `CONTROLLER_MSE_SIMULATIONS` for `is_mse_run` |
  | `species[]` | Every entry of the contract, in catalog order: `species_code`, `life_stage`, `kind` (`species` or `functional_group`, ADR 0029), `hcr_eligible` (only those can carry a rule), `species_name` (a group's name for a group), `scientific_name`, `members[]` (a group's species; empty for a species), `functional_group` and `functional_group_name` (deprecated, always null), `initial_biomass_kg`, `initial_fishing_mortality` (null when the controller has no value for the entry), `default_biomass_limit_kg`, `default_biomass_base_kg`, `default_f_max` (the controller's default rule, to prefill a new rule with; null when none) |
  | `hcr_configurations[]` | Your saved configurations for the scenario: `id`, `name`, `rule_count`, `updated_at`; the rules are at `get hcr configuration` |
  | `initial_values_available`, `initial_hcr_snapshot_id`, `notes` | Whether the controller answered `GetInitialHCRData` (only `northwestern_med` today), the snapshot of that answer, and what is missing |

  Biomass in kg. Unknown scenario: `404`.
