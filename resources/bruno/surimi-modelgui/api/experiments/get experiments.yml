info:
  name: get experiments
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/api/v1/experiments?size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  # get experiments

  Your experiments, newest first. Filters: `status`, `scenario`, `q` (words
  of the name), `submitted_from`, `submitted_to`, `owner_id` (admins), `page`,
  `size`, `sort`.
