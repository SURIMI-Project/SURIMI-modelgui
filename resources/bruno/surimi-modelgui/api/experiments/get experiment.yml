info:
  name: get experiment
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/api/v1/experiments/{{experimentId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  # get experiment

  One experiment with its simulations (5 for an MSE run, run in parallel; each
  with its controller status, month reached and `progress`),
  `simulation_counts` (for example `{"initialising": 3, "initialised": 2}`),
  `progress`, `stalled` and its reason, `error`, the stored request (HCR biomass in kg)
  and the 50 newest events. Status `initialised` means every simulation is
  initialised and waits for the controller to start them together.
