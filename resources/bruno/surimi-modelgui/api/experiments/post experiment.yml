info:
  name: post experiment
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/api/v1/experiments"
  body:
    type: json
    data: |-
      {
        "name": "Hake and sardine HCR to 2014",
        "scenario_name": "northwestern_med",
        "end_date_time": "2014-01-01T00:00:00Z",
        "is_mse_run": false,
        "climate_scenario": "RCP_4.5",
        "harvest_control_rules": [
          {"species_code": "HKE", "life_stage": "adult", "biomass_limit_kg": 4000000, "biomass_base_kg": 16000000, "f_max": 0.3},
          {"species_code": "PIL", "life_stage": "adult", "biomass_limit_kg": 9000000, "biomass_base_kg": 30000000, "f_max": 0.25}
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 202) {
          bru.setEnvVar("experimentId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  # post experiment

  Validates against the scenario catalog and contract, then queues (`202`,
  `status: queued`, `queue_position`). HCR biomass in kg, from one of:
  `harvest_control_rules` (as given; `[]` for none) or `hcr_configuration_id`
  (one of your configurations for the scenario, its rules copied into the
  request; someone else's is a `404`). Not both (`422`). Neither: no rules
  (there are no defaults). Stores `experimentId`.

  Errors: `422` lists every problem (dates, climate scenario, HCR
  eligibility); `409` too many queued; `404` unknown scenario.
