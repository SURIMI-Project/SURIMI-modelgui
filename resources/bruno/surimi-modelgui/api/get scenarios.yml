info:
  name: get scenarios
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/api/v1/scenarios"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # get scenarios

  Scenario names the controller can run (`GetScenarioNames`), cached for
  `CATALOG_CACHE_SECONDS` (10 min).

  ## Response

  `{"scenarios": [{"name": "aegean_sea"}, ...]}`. With `CONTROLLER_MODE=fake`
  always `aegean_sea`, `anchovy_bay`, `northwestern_med`.

  ## Notes

  Controller unreachable or not serving the protocol: `502` with
  `error.code` `controller_unavailable`; too slow: `504` `controller_timeout`.
