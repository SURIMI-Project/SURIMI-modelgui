docs: |-
  # get audit events

  The audit log, newest first. Admin only. Kept 24 months (ADR 0013).

  ## Query

  | Parameter | Meaning |
  | --- | --- |
  | `actor_id` | Who did it (a user id) |
  | `action` | `user.created`, `role.synced`, `experiment.cancelled`, `outputs.downloaded`, `species.imported`, ... |
  | `target_type`, `target_id` | What it was done to (`user`, `experiment`, ...) |
  | `from`, `to` | Period: `from` inclusive, `to` exclusive |
  | `page`, `size` | From 1; `size` at most 200 |

  ## Response

  `{"items", "total", "page", "size", "period"}`; each item has `at`,
  `actor_id` and `actor_username` (`null` for the system, such as an SSO role
  sync), `action`, `target_type`, `target_id`, `details`.
