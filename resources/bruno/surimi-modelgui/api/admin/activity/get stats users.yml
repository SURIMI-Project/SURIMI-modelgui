info:
  name: get stats users
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/api/v1/admin/stats/users?sort=-last_login_at&page=1&size=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # get stats users

  Per user: how often they signed in, when they last did, and their
  experiments, for a period. Admin only.

  ## Query

  | Parameter | Meaning |
  | --- | --- |
  | `from`, `to` | Period: `from` inclusive, `to` exclusive; both optional |
  | `q` | Part of the e-mail, username or a name |
  | `role` | `admin` or `member` |
  | `sort` | `username`, `-last_login_at` (default), `-sign_ins`, `-experiments_submitted`, `-experiments_completed` |
  | `page`, `size` | From 1; `size` at most 200 |

  ## Response

  `{"items", "total", "page", "size", "period"}`. Each item has the user
  (`user_id`, `username`, `display_name`, `email`, `role`, `is_active`,
  `account`), `last_login_at` and `last_login_method`, and the counts of
  `get stats` for that user. Deleted experiments still count.
