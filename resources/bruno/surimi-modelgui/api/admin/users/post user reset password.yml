info:
  name: post user reset password
  type: http
  seq: 5

http:
  method: POST
  url: "{{apiUrl}}/api/v1/admin/users/{{userId}}/reset-password"
  body:
    type: json
    data: |-
      {
        "temporary_password": "reset-by-admin-2026"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # post user reset password

  Sets a temporary password for the user in `userId`. Admin only. Side
  effects: all the user's sessions end, and they must change the password at
  their next sign-in. `204`.

  ## Notes

  SSO-only user (no password here): `409` `no_local_password`. Weak
  password: `422` `weak_password`.
