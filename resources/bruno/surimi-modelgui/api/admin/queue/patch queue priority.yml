info:
  name: patch queue priority
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{apiUrl}}/api/v1/admin/queue/{{experimentId}}"
  body:
    type: json
    data: |-
      {
        "priority": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  # patch queue priority

  Priority of a queued experiment, -100..100 (audited).
