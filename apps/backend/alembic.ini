# For running `alembic` by hand from apps/backend, e.g.
#   uv run alembic revision --autogenerate -m "users"
# The database URL comes from the DB_* / DATABASE_URL environment variables
# (see src/surimi_backend/migrations/env.py), not from this file.
# Containers use `surimi-backend migrate` instead.

[alembic]
script_location = %(here)s/src/surimi_backend/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
