name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      redeploy_all:
        description: "develop only: rebuild both images and reconcile the whole stack"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; branch runs queue, so a deploy
  # is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'deployments/nginx/**'
              - '.dockerignore'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            backend:
              - 'apps/backend/**'
              - 'packages/proto/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'deployments/mounts/postgres/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # Only these can change what packages/proto/generate.py writes.
            proto:
              - 'packages/proto/**'
              - 'uv.lock'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (typecheck + Vite)
        run: npm run build
      - name: Lint
        # 20 lint errors exist on main since before the monorepo move
        # (docs/ISSUES.md). Report them without failing until they are fixed,
        # then remove continue-on-error.
        continue-on-error: true
        run: npm run lint

  frontend-image:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the frontend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check apps/backend packages/proto/generate.py
      - name: Format
        run: uv run ruff format --check apps/backend packages/proto/generate.py
      - name: Types (mypy strict)
        working-directory: apps/backend
        run: uv run mypy
      - name: Tests, including PostgreSQL in Docker
        working-directory: apps/backend
        run: uv run pytest -q

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  proto-stubs:
    # Regenerates the controller stubs from the pinned protocol and fails if
    # they differ from what is committed (ADR 0011).
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces=false   # the buf CLI, a root devDependency
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - run: uv sync --package surimi-protocol --frozen
      - run: uv run --package surimi-protocol python packages/proto/generate.py
      - name: Committed stubs match the pinned protocol
        run: git diff --exit-code -- packages/proto

  compose-files:
    # deployments/compose.yml (images) and compose.local.yml (built from source)
    # must describe the same stack apart from image and build (ADR 0026).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml and compose.local.yml in step
        run: python3 .github/scripts/check-compose-files.py

  deploy-develop:
    # Builds the changed images on the develop server and rolls only what changed
    # (ADR 0026, docs/features/develop-deployment). Runs on the self-hosted runner
    # of that server, after the checks above, for pushes to develop and manual runs.
    needs: [changes, frontend, frontend-image, backend, backend-image, proto-stubs, compose-files]
    if: >-
      always()
      && github.ref == 'refs/heads/develop'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    # The develop server's runner (labels self-hosted, Linux, X64).
    runs-on: [self-hosted, Linux, X64]
    environment: develop
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KEEP_IMAGES: ${{ vars.DEPLOY_KEEP_IMAGES || '5' }}
      FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.redeploy_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff reaches back to the commit last deployed.
          fetch-depth: 0
      - name: Build, sync and roll
        run: bash .github/scripts/deploy.sh
