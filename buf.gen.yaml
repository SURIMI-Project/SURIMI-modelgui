# Generates the TypeScript client for the SURIMI controller.
# Input is a descriptor set pulled from the controller's server reflection
# (see the "proto:pull" script) until we get the .proto sources.
version: v2
inputs:
  - binary_image: proto/surimi.binpb
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt: target=js+dts  # plain JS + .d.ts: TS enums would trip erasableSyntaxOnly
clean: true
