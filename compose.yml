services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SURIMI_PORT:-18080}:80"
    environment:
      # Substituted into nginx/default.conf.template at container start.
      # Defaults to the grpc-proxy service below (the browser speaks gRPC-Web).
      CONTROLLER_BASE_URL: ${CONTROLLER_BASE_URL:-http://grpc-proxy:8080}
    restart: unless-stopped

  # gRPC-Web -> gRPC bridge in front of the SURIMI controller. Opt-in via profile:
  #   docker compose up grpc-proxy                (just the proxy)
  #   docker compose --profile grpc-proxy up      (proxy + web)
  grpc-proxy:
    image: envoyproxy/envoy:v1.36.13
    profiles: ["grpc-proxy"]
    entrypoint: ["sh", "/etc/envoy/entrypoint.sh"]
    environment:
      # Native gRPC endpoint of the controller. Required (entrypoint.sh fails
      # fast without it); not marked :? here so the web service alone still runs.
      CONTROLLER_GRPC_URL: ${CONTROLLER_GRPC_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-.*}
    volumes:
      - ./envoy:/etc/envoy:ro,z
    ports:
      - "${GRPC_PROXY_PORT:-18081}:8080"
    restart: unless-stopped
